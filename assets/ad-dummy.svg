<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-labelledby="title desc">
  <title id="title">Promo bubble placeholder</title>
  <desc id="desc">An elongated oval gradient used as a temporary promotional badge.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ff8a00" />
      <stop offset="50%" stop-color="#ff3b6f" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.25)" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <ellipse cx="160" cy="60" rx="144" ry="46" fill="url(#g)" />
    <ellipse cx="180" cy="46" rx="70" ry="20" fill="rgba(255,255,255,0.35)" />
  </g>
</svg>
